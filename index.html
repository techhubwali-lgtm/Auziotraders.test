    <!-- Structured Data (Schema.org AutoDealer + Organization + FAQPage) -->

      {
        "@context": "https://schema.org",

            "@type": ["Organization", "AutoDealer"],

            "telephone": "+81-45-550-8924",
            "email": "export@auziotraders.com",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "2-14-8 Daikoku-futo, Tsurumi-ku",
              "addressLocality": "Yokohama",
              "addressRegion": "Kanagawa",
              "postalCode": "230-0054",
              "addressCountry": "JP"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://auziotraders.com/#website",
            "url": "https://auziotraders.com/",
            "name": "Auzio Traders",
            "publisher": { "@id": "https://auziotraders.com/#organization" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do I buy a vehicle from Auzio Traders?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Select an available vehicle or live Japanese auction lot, choose your destination port for CIF calculation, request a Proforma Invoice or submit a sourcing request, and settle via official Bank Telegraphic Transfer."
                }
              },
              {
                "@type": "Question",
                "name": "What is the difference between FOB and CIF pricing?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "FOB covers the vehicle price and Japanese export clearance up to loading in Japan. CIF adds ocean freight, mandatory pre-shipment inspection (QISJ, JEVIC, DAFF), and optional marine insurance to your destination port."
                }
              },
              {
                "@type": "Question",
                "name": "Can I participate in live Japanese car auctions?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Browse live Japanese auction lots directly on Auzio Traders and authorize a written Max Bid Ceiling so our licensed Yokohama buyers bid strictly within your limit."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Ignore third-party browser extension fetch-interceptor errors -->
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = (event && (event.filename || (event.error && event.error.stack))) || '';
          if (typeof src === 'string' && src.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
