<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return customFetch; },
                set: function(fn) { customFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Suppress unhandled errors caused by external browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch of') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
